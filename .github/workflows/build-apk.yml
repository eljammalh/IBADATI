name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Ibadati.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ibadati-apk
          path: Ibadati.apk
      # Also publish the APK as the "latest" release, so it can be downloaded
      # from a simple link without signing in or unzipping.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Ibadati.apk --title "Ibadati (latest)" --notes "Latest build of Ibadati. Download Ibadati.apk and install it over the existing app." --latest
